name: Publish macOS release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Restore binary artwork in repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYASSET'
          import base64
          from pathlib import Path
          for name in ('Farm.icns', 'MenuBarIcon.png', 'icon.png'):
              path = Path('Assets') / name
              path.write_bytes(base64.b64decode(Path(str(path)+'.base64').read_bytes()))
          PYASSET
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Farm.icns Assets/MenuBarIcon.png Assets/icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Update application and menu-bar artwork"
            git push origin HEAD:main
          fi
      - name: Test
        run: python3 scripts/test.py
      - name: Build and verify app
        run: bash scripts/build.sh
      - name: Publish v0.4.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.4.1 .build/Old-MacDonalds-Desktop-Farm-macOS.zip --target "$(git rev-parse HEAD)" --title "v0.4.1 — A fresh little face" --notes "New charcoal and cream pixel-fox app icon and a matching monochrome menu-bar symbol. The menu icon follows macOS light/dark appearance and remains consistent across all three pals. Apple Silicon, macOS 14.2+. Locally signed, not Apple-notarized."
